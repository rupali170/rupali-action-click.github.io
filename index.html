<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Rupali Action Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rupali Action Photography</h1>
    <p>Adrenaline captured in every frame.</p>
  </header>

  <main>
    <section class="upload-section">
      <h2>फोटो Upload (Demo)</h2>
      <p>सध्या हा फक्त demo आहे. फोटो निवडा आणि Preview बघा.</p>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <button id="previewBtn">Preview दाखव</button>
    </section>

    <section class="gallery-section">
      <h2>Live गॅलरी</h2>
      <div id="gallery" class="gallery">
        </div>
    </section>

    <section class="static-gallery-section">
      <h2>माझे Action फोटो</h2>
      <p>येथे तुझे सर्वोत्तम क्लिक्स दिसतील.</p>
      <div class="gallery">
        <img src="images/cricket_action_01.jpg" alt="Action Shot 1">
        <img src="images/cricket_action_02.jpg" alt="Action Shot 2">
        <img src="images/cricket_action_03.jpg" alt="Action Shot 3">
        <img src="images/cricket_action_04.jpg" alt="Action Shot 4">
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Rupali Action Photography | सर्व हक्क राखीव</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
